# Build APK otomatis saat push ke main / manual trigger
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # tombol "Run workflow" di GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install NativeScript CLI
        run: npm install -g nativescript

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: ns platform add android || true

      - name: Build APK (production)
        run: ns build android --env.production
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Locate APK
        id: apk
        run: |
          APK=$(find platforms -name "*.apk" 2>/dev/null | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK" || (echo "APK not found" && find platforms -type f | head -30 && exit 1)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktp-checker-android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
