name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NativeScript CLI
        run: npm install -g nativescript

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: ns platform add android || true

      - name: Build APK
        run: ns build android --env.production
        continue-on-error: true

      - name: List APK files
        run: |
          echo "=== Mencari file APK ==="
          find . -name "*.apk" -type f
          ls -la platforms/android/app/build/outputs/apk/ || true
          ls -la platforms/android/build/outputs/apk/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ktp-checker-android
          path: |
            **/*.apk
          if-no-files-found: warn
