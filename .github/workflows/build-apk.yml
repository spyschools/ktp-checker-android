name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NativeScript CLI
        run: npm install -g nativescript

      - name: Install project dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Add Android platform
        run: ns platform add android || true

      - name: Build APK (debug)
        run: ns build android --env.production
        continue-on-error: true

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find platforms/android -name "*.apk" | head -n 1)
          echo "APK path: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -la platforms/android/app/build/outputs/apk/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ktp-checker-android
          path: |
            platforms/android/app/build/outputs/apk/**/*.apk
            **/*.apk
          if-no-files-found: warn
